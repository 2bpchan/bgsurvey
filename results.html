<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lunch Game Rankings · Results</title>
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --ink:#1d2027; --muted:#6b7280;
    --line:#e3e6eb; --accent:#4f46e5; --accent-ink:#ffffff; --shadow:0 1px 3px rgba(0,0,0,.08),0 6px 18px rgba(0,0,0,.05);
    --gold:#e0a80d; --silver:#9aa3ad; --bronze:#c07a3e;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#15171c; --panel:#1e2128; --ink:#e8eaed; --muted:#9aa2b1;
      --line:#31353f; --accent:#7c74ff; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
      --gold:#f2c14e; --silver:#b6bec8; --bronze:#d08b4f; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.45; -webkit-font-smoothing:antialiased;}
  header.bar{position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--panel) 92%, transparent);
    backdrop-filter:saturate(1.4) blur(8px); border-bottom:1px solid var(--line); box-shadow:var(--shadow);}
  .bar-inner{max-width:1120px; margin:0 auto; padding:12px 20px; display:flex; flex-wrap:wrap; gap:12px 18px; align-items:center;}
  .bar h1{font-size:17px; margin:0; font-weight:700; letter-spacing:.2px; white-space:nowrap;}
  .bar h1 span{color:var(--muted); font-weight:500;}
  .grow{flex:1 1 40px}
  a.btn, button.btn{font:inherit; font-size:13.5px; font-weight:600; cursor:pointer; border-radius:9px; padding:8px 14px;
    border:1px solid var(--line); background:var(--panel); color:var(--ink); transition:.12s; text-decoration:none; display:inline-block;}
  a.btn:hover, button.btn:hover{border-color:var(--accent)}
  .btn.ghost{background:transparent}
  main{max-width:1120px; margin:0 auto; padding:22px 20px 80px;}
  .intro{color:var(--muted); font-size:13.5px; margin:4px 2px 18px; max-width:820px;}

  /* ---- drop zone ---- */
  #drop{border:2px dashed var(--line); border-radius:16px; background:var(--panel); padding:34px 20px; text-align:center;
    transition:.15s; cursor:pointer;}
  #drop.hover{border-color:var(--accent); background:color-mix(in srgb,var(--accent) 8%, var(--panel));}
  #drop .big{font-size:15px; font-weight:700; margin-bottom:4px;}
  #drop .sub{font-size:13px; color:var(--muted);}
  #drop.slim{padding:16px; }
  .err{margin:14px 0 0; font-size:13px; font-weight:600; color:#e0483f;}

  .meta{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:18px 2px 6px; font-size:13px; color:var(--muted);}
  .meta b{color:var(--ink)}
  .sorts{display:flex; flex-wrap:wrap; gap:6px; margin-left:auto;}
  .sortbtn{font:inherit; font-size:12.5px; font-weight:600; cursor:pointer; border-radius:999px; padding:5px 12px;
    border:1px solid var(--line); background:var(--panel); color:var(--muted); transition:.12s;}
  .sortbtn:hover{color:var(--ink); border-color:var(--muted);}
  .sortbtn.on{background:var(--accent); border-color:var(--accent); color:var(--accent-ink);}

  /* ---- podium ---- */
  .podium{display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin:16px 0 26px;}
  .pod{background:var(--panel); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
    padding:18px 14px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px;
    border-top:4px solid var(--line);}
  .pod.p1{border-top-color:var(--gold)} .pod.p2{border-top-color:var(--silver)} .pod.p3{border-top-color:var(--bronze)}
  .pod .medal{font-size:22px; line-height:1}
  .pod .art{width:104px; height:138px; border-radius:12px; overflow:hidden; background:var(--bg);
    border:1px solid var(--line); position:relative; flex:none;}
  .pod .art img{width:100%; height:100%; object-fit:cover; display:block;}
  .pod .pname{font-size:15px; font-weight:700; line-height:1.25;}
  .pod .pts{font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--accent);}
  .pod .pts small{font-size:11px; font-weight:600; color:var(--muted); display:block; letter-spacing:.4px; text-transform:uppercase;}
  @media (max-width:700px){ .podium{grid-template-columns:1fr;} }

  /* ---- ranked rows ---- */
  .rows{display:flex; flex-direction:column; gap:10px;}
  .row{background:var(--panel); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);
    padding:12px 16px; display:flex; align-items:center; gap:14px;}
  .row .rk{font-size:14px; font-weight:800; color:var(--muted); font-variant-numeric:tabular-nums;
    min-width:34px; text-align:right; flex:none;}
  .row.top .rk{color:var(--accent)}
  .thumb{flex:none; width:44px; height:58px; border-radius:8px; overflow:hidden; background:var(--bg);
    border:1px solid var(--line); position:relative;}
  .thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .ph{position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:3px;
    font-size:10px; font-weight:800; color:var(--muted); background:var(--bg); line-height:1.1;}
  .ph[hidden]{display:none;}
  .row .info{flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:6px;}
  .row .gname{font-size:14.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .bar-track{height:7px; border-radius:999px; background:var(--bg); border:1px solid var(--line); overflow:hidden;}
  .bar-fill{height:100%; background:var(--accent); border-radius:999px; transition:width .35s ease;}
  .cats{display:flex; flex-wrap:wrap; gap:6px;}
  .catchip{font-size:11px; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:2px 9px;
    background:var(--bg); white-space:nowrap;}
  .catchip b{color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums;}
  .row .tot{flex:none; text-align:right; min-width:74px;}
  .row .tot .n{font-size:19px; font-weight:800; font-variant-numeric:tabular-nums;}
  .row.top .tot .n{color:var(--accent)}
  .row .tot .l{font-size:10px; font-weight:600; color:var(--muted); text-transform:uppercase; letter-spacing:.4px;}
  @media (max-width:560px){
    .row{flex-wrap:wrap;}
    .row .info{flex-basis:100%; order:3;}
  }
  @media (max-width:520px){ .bar h1 span{display:none} }
</style>
</head>
<body>
<header class="bar">
  <div class="bar-inner">
    <h1>🏆 Results <span>· lunch game rankings</span></h1>
    <div class="grow"></div>
    <a class="btn ghost" href="index.html">← Survey</a>
    <a class="btn ghost" href="aggregate.html">📊 Aggregate</a>
    <button class="btn" id="clear" hidden>Clear</button>
  </div>
</header>

<main>
  <p class="intro">
    Load the <b>totals CSV</b> exported from the <a href="aggregate.html">aggregate page</a>
    (<code>Rank, Game, …categories…, Total</code>) to see the final standings with box art.
    The file stays in this browser — nothing is uploaded.
  </p>

  <div id="drop">
    <div class="big">Drag &amp; drop the totals CSV here</div>
    <div class="sub">…or click to choose a file.</div>
    <input type="file" id="file" accept=".csv,text/csv" hidden>
  </div>
  <p class="err" id="err" hidden></p>

  <div id="results" hidden>
    <div class="meta" id="meta"></div>
    <div class="podium" id="podium"></div>
    <div class="rows" id="rows"></div>
  </div>
</main>

<script>
/* ---- game name -> image slug (same list/order as index.html) -------------- */
const GAMES = [
  {name:"Exploding Kittens", slug:"exploding-kittens"},
  {name:"Love Letter (OG)", slug:"love-letter-og"},
  {name:"Love Letter 2", slug:"love-letter-2"},
  {name:"Sandbag", slug:"sandbag"},
  {name:"Scout", slug:"scout"},
  {name:"Startups", slug:"startups"},
  {name:"Moving Wild", slug:"moving-wild"},
  {name:"Seers Catalog", slug:"seers-catalog"},
  {name:"Mountain Photographer", slug:"mountain-photographer"},
  {name:"Meow", slug:"meow"},
  {name:"Lumberjacks", slug:"lumberjacks"},
  {name:"Infiltraitors", slug:"infiltraitors"},
  {name:"No Loose Ends", slug:"no-loose-ends"},
  {name:"VIVO", slug:"vivo"},
  {name:"Card Bullet", slug:"card-bullet"},
  {name:"Tiger and Dragon", slug:"tiger-and-dragon"},
  {name:"Sea Salt and Paper", slug:"sea-salt-and-paper"},
  {name:"Daifugo", slug:"daifugo"},
  {name:"Matchstick Daifugo", slug:"matchstick-daifugo"},
  {name:"MOJO", slug:"mojo"},
  {name:"Skull", slug:"skull"},
  {name:"Spades", slug:"spades"},
  {name:"Maskmen", slug:"maskmen"},
  {name:"Gachapon", slug:"gachapon"},
  {name:"Odin", slug:"odin"},
  {name:"Movies", slug:"movies"},
  {name:"Gods", slug:"gods"},
  {name:"Shards", slug:"shards"},
  {name:"Pirates", slug:"pirates"},
  {name:"Mofuchip", slug:"mofuchip"},
  {name:"67 (Flip Seven)", slug:"flip-seven"},
  {name:"Beer Mug Dice", slug:"beer-mug-dice"},
  {name:"Kobayakawa", slug:"kobayakawa"},
  {name:"Warp 99", slug:"warp-99"},
  {name:"Jabba's Palace", slug:"jabbas-palace"},
  {name:"Wingspan Pocket", slug:"wingspan-pocket"}
];
const SLUGS = {};
GAMES.forEach(g=> SLUGS[g.name.trim().toLowerCase()] = g.slug);
function slugFor(name){
  const k = String(name).trim().toLowerCase();
  return SLUGS[k] || k.replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
}
function initials(name){
  return String(name).replace(/[^a-z0-9 ]/gi,"").split(/\s+/).filter(Boolean)
    .slice(0,2).map(w=>w[0].toUpperCase()).join("") || "?";
}

/* ---- state --------------------------------------------------------------- */
const STORE_KEY = "bgresults_v1";
let cats = [];       // category column names, in CSV order
let rows = [];       // {game, total, pts:{cat:n}}
let fileName = "";
let sortKey = "__total";

/* ---- CSV parser (handles quotes, commas, CRLF, BOM) ---------------------- */
function parseCSV(text){
  text = text.replace(/^﻿/, "");
  const out=[]; let row=[]; let cell=""; let q=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i];
    if(q){
      if(ch === '"'){ if(text[i+1] === '"'){ cell+='"'; i++; } else q=false; }
      else cell+=ch;
    }else{
      if(ch === '"') q=true;
      else if(ch === ',') { row.push(cell); cell=""; }
      else if(ch === '\n'){ row.push(cell); out.push(row); row=[]; cell=""; }
      else if(ch === '\r'){ /* handled by \n */ }
      else cell+=ch;
    }
  }
  if(cell.length || row.length){ row.push(cell); out.push(row); }
  return out.filter(r=> r.length && !(r.length===1 && r[0].trim()===""));
}

/* ---- load the totals CSV -------------------------------------------------- */
function load(name, text){
  const table = parseCSV(text);
  if(table.length < 2) return fail("That file has no data rows.");
  const header = table[0].map(h=>h.trim());
  const lower  = header.map(h=>h.toLowerCase());
  const gi = lower.indexOf("game");
  const ti = lower.indexOf("total");
  if(gi === -1) return fail("No “Game” column found — is this the totals CSV?");
  if(ti === -1) return fail("No “Total” column found. This looks like a per-person survey CSV — run it through the aggregate page first, then export totals.");

  const skip = new Set(["rank","game","total"]);
  const catCols = [];
  header.forEach((h,idx)=>{ if(!skip.has(lower[idx]) && h !== "") catCols.push({idx, name:h}); });

  const parsed = [];
  for(let r=1;r<table.length;r++){
    const line = table[r];
    const game = (line[gi]||"").trim();
    if(!game) continue;
    const total = Number(String(line[ti]||"").trim());
    if(!Number.isFinite(total)) continue;
    const pts = {};
    catCols.forEach(c=>{
      const n = Number(String(line[c.idx]||"").trim());
      pts[c.name] = Number.isFinite(n) ? n : 0;
    });
    parsed.push({game, total, pts});
  }
  if(!parsed.length) return fail("Couldn’t read any game rows out of that file.");

  cats = catCols.map(c=>c.name);
  rows = parsed;
  fileName = name;
  sortKey = "__total";
  try{ localStorage.setItem(STORE_KEY, JSON.stringify({name, text})); }catch(e){}
  showError("");
  render();
}
function fail(msg){ showError(msg); return false; }
function showError(msg){
  const el = document.getElementById("err");
  el.textContent = msg; el.hidden = !msg;
}

/* ---- rendering ------------------------------------------------------------ */
function esc(s){ return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m])); }

function artHTML(game, cls){
  const slug = slugFor(game);
  return `<div class="${cls}"><img src="images/${esc(slug)}.png" alt="${esc(game)}" loading="lazy"
      onerror="this.style.display='none'; this.nextElementSibling.hidden=false;"
      ><div class="ph" hidden>${esc(initials(game))}</div></div>`;
}

function valueOf(r){ return sortKey === "__total" ? r.total : (r.pts[sortKey] || 0); }

function render(){
  document.getElementById("results").hidden = false;
  document.getElementById("clear").hidden = false;
  document.getElementById("drop").classList.add("slim");
  document.querySelector("#drop .big").textContent = "Load a different totals CSV";
  document.querySelector("#drop .sub").textContent = "Drag & drop, or click to choose.";

  const sorted = rows.slice().sort((a,b)=> valueOf(b)-valueOf(a) || a.game.localeCompare(b.game));
  const max = Math.max(1, ...sorted.map(valueOf));
  const grand = rows.reduce((s,r)=>s+r.total,0);

  // meta line + sort buttons
  const keys = [{k:"__total", l:"Total"}, ...cats.map(c=>({k:c, l:c}))];
  document.getElementById("meta").innerHTML =
    `<span><b>${rows.length}</b> games · <b>${grand}</b> points cast · <b>${esc(fileName)}</b></span>` +
    `<span class="sorts">` + keys.map(o=>
      `<button class="sortbtn${sortKey===o.k?" on":""}" data-k="${esc(o.k)}">${esc(o.l)}</button>`).join("") +
    `</span>`;
  document.querySelectorAll(".sortbtn").forEach(b=>
    b.addEventListener("click", ()=>{ sortKey = b.dataset.k; render(); }));

  // podium (top 3)
  const medals = ["🥇","🥈","🥉"];
  document.getElementById("podium").innerHTML = sorted.slice(0,3).map((r,i)=>`
    <div class="pod p${i+1}">
      <div class="medal">${medals[i]}</div>
      ${artHTML(r.game,"art")}
      <div class="pname">${esc(r.game)}</div>
      <div class="pts">${valueOf(r)}<small>${sortKey==="__total"?"total points":esc(sortKey)}</small></div>
    </div>`).join("");

  // full ranked list
  document.getElementById("rows").innerHTML = sorted.map((r,i)=>`
    <div class="row${i<3?" top":""}">
      <div class="rk">${i+1}</div>
      ${artHTML(r.game,"thumb")}
      <div class="info">
        <div class="gname">${esc(r.game)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${(valueOf(r)/max*100).toFixed(1)}%"></div></div>
        <div class="cats">${cats.map(c=>`<span class="catchip">${esc(c)} <b>${r.pts[c]||0}</b></span>`).join("")}</div>
      </div>
      <div class="tot"><div class="n">${valueOf(r)}</div>
        <div class="l">${sortKey==="__total"?"points":esc(sortKey)}</div></div>
    </div>`).join("");
}

/* ---- file intake ---------------------------------------------------------- */
function addFile(list){
  const file = Array.from(list||[]).find(f=>/\.csv$/i.test(f.name) || f.type==="text/csv" || f.type==="");
  if(!file){ showError("Please drop a .csv file."); return; }
  const reader = new FileReader();
  reader.onload  = ()=> load(file.name, String(reader.result));
  reader.onerror = ()=> showError("Couldn’t read that file.");
  reader.readAsText(file);
}

const drop = document.getElementById("drop");
const fileInput = document.getElementById("file");
drop.addEventListener("click", ()=> fileInput.click());
fileInput.addEventListener("change", ()=>{ addFile(fileInput.files); fileInput.value=""; });
["dragenter","dragover"].forEach(ev=> drop.addEventListener(ev, e=>{ e.preventDefault(); drop.classList.add("hover"); }));
["dragleave","dragend"].forEach(ev=> drop.addEventListener(ev, e=>{ if(e.target===drop) drop.classList.remove("hover"); }));
drop.addEventListener("drop", e=>{ e.preventDefault(); drop.classList.remove("hover"); if(e.dataTransfer?.files) addFile(e.dataTransfer.files); });
document.addEventListener("dragover", e=>e.preventDefault());
document.addEventListener("drop", e=>{ e.preventDefault(); if(e.target!==drop && e.dataTransfer?.files) addFile(e.dataTransfer.files); });

document.getElementById("clear").addEventListener("click", ()=>{
  rows=[]; cats=[]; fileName="";
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  document.getElementById("results").hidden = true;
  document.getElementById("clear").hidden = true;
  drop.classList.remove("slim");
  document.querySelector("#drop .big").textContent = "Drag & drop the totals CSV here";
  document.querySelector("#drop .sub").textContent = "…or click to choose a file.";
  showError("");
});

/* ---- restore last loaded file -------------------------------------------- */
try{
  const saved = JSON.parse(localStorage.getItem(STORE_KEY));
  if(saved && saved.text) load(saved.name || "saved.csv", saved.text);
}catch(e){}
</script>
</body>
</html>
